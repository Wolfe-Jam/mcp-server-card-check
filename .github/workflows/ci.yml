name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The validator file matches the schema
        run: npm run build:validator && git diff --exit-code -- worker/validator.cjs
      - name: Pack, install and run the bin (the npx path)
        run: npm run smoke
